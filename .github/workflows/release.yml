# Publish the package to PyPI when a version tag is pushed.
#
# Uses PyPI trusted publishing (OIDC): no long-lived token lives in this repo.
# Inert until the trusted publisher is registered once on pypi.org for
# project "axonmesh" -> this repository, workflow release.yml, environment
# pypi. Until then a tag push fails this job loudly instead of publishing
# nothing silently.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Refuse a tag that disagrees with the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag but pyproject says $version — releasing that pair would ship a lie"
            exit 1
          fi
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
